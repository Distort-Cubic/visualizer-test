<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CQT Octave Visualizer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #050505;
            color: #ddd;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        #controls {

            flex: 0 0 auto;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 12px 16px;

            background: #101010;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.1);
        }

        #file {
            max-width: 300px;
        }

        button {
            padding:
                6px 14px;

            background: #222;
            color: #ddd;

            border:
                1px solid rgba(255, 255, 255, 0.15);

            border-radius: 5px;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #status {
            font-size: 12px;
            color: #888;
        }

        #visualizer {

            flex: 1;

            min-height: 0;

            overflow-y: auto;

            padding:
                24px 30px 40px;
        }

        #octaves {

            display: flex;
            flex-direction: column;

            gap: 18px;

            max-width: 1400px;

            margin: 0 auto;
        }

        .octave {

            position: relative;

            display: flex;
            flex-direction: column;

            gap: 6px;
        }

        .octave-header {

            display: flex;

            align-items: baseline;

            justify-content: space-between;

            font-size: 12px;

            color: #aaa;
        }

        .octave-name {

            font-size: 14px;
            color: #ddd;
        }

        .octave-range {

            position: relative;

            height: 90px;

            border:
                1px solid rgba(255, 255, 255, 0.1);

            background:
                rgba(255, 255, 255, 0.025);

            overflow: hidden;
        }

        canvas {

            display: block;

            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>

    <div id="controls">

        <input id="file" type="file" accept="audio/*">

        <button id="play" disabled>
            Play
        </button>

        <span id="status">
            Choose an audio file.
        </span>

    </div>


    <div id="visualizer">

        <div id="octaves"></div>

    </div>


    <script type="module">

        /*
            cqt-web is the local copy of:
        
                ./dist/cqt.js
        
            Its ES module exports createCQTModule
            as the default export.
        */

        import createCQTModule
            from "./dist/cqt.js";


        /* ============================================================
           DOM
           ============================================================ */

        const fileInput =
            document.getElementById("file");

        const playButton =
            document.getElementById("play");

        const statusElement =
            document.getElementById("status");

        const octaveContainer =
            document.getElementById("octaves");


        /* ============================================================
           AUDIO STATE
           ============================================================ */

        let audioContext = null;

        let audioBuffer = null;

        let sourceNode = null;

        let playing = false;

        let playbackOffset = 0;

        let playbackStartTime = 0;


        /* ============================================================
           CQT STATE
           ============================================================ */

        let Module = null;

        let cqt = null;

        let cqtResult = null;

        let numFrames = 0;

        let nBins = 0;

        let frequencies = null;


        /*
            Analysis parameters.
        
            24 bins/octave means:
        
                24 CQT samples
                between each octave.
        
            7 octaves means:
        
                168 total bins.
        */

        const BINS_PER_OCTAVE = 24;

        const OCTAVES = 7;

        const N_BINS =
            BINS_PER_OCTAVE *
            OCTAVES;


        /*
            Low frequency.
        
            55 Hz = A1.
        
            With 7 octaves this covers approximately:
        
                55 Hz
                through
                7040 Hz
        */

        const FMIN = 55;


        /*
            Hop length determines the time resolution.
        
            Smaller = more frames,
            larger = cheaper computation.
        */

        const HOP_LENGTH = 512;


        /* ============================================================
           INITIALIZE CQT MODULE
           ============================================================ */
        async function initializeCQT() {

            statusElement.textContent =
                "Initializing CQT...";

            Module = await createCQTModule({

                locateFile: (path) => {

                    if (path.endsWith(".wasm")) {
                        return "./dist/" + path;
                    }

                    return path;
                }

            });

            statusElement.textContent =
                "CQT ready.";
        }


        /* ============================================================
           FILE LOADING
           ============================================================ */

        fileInput.addEventListener(
            "change",
            async event => {

                const file =
                    event.target.files[0];

                if (!file)
                    return;

                try {

                    statusElement.textContent =
                        "Loading audio...";

                    /*
                        Create AudioContext lazily.
                    */

                    if (!audioContext) {

                        audioContext =
                            new AudioContext();
                    }

                    if (
                        audioContext.state ===
                        "suspended"
                    ) {

                        await audioContext.resume();
                    }


                    /*
                        Decode the uploaded file.
                    */

                    const arrayBuffer =
                        await file.arrayBuffer();

                    audioBuffer =
                        await audioContext
                            .decodeAudioData(
                                arrayBuffer
                            );


                    /*
                        Recreate CQT.
        
                        We use the actual audio sample rate.
        
                        This is important because the CQT
                        frequency mapping depends on it.
                    */

                    if (cqt) {

                        cqt.delete();

                        cqt = null;
                    }


                    cqt =
                        new Module.HybridCQT(

                            audioBuffer.sampleRate,

                            HOP_LENGTH,

                            BINS_PER_OCTAVE,

                            N_BINS,

                            FMIN
                        );


                    /*
                        Get the actual frequency of every
                        CQT bin from the library.
                    */

                    frequencies =
                        cqt.getFrequencies();


                    /*
                        Flatten the first audio channel.
        
                        The CQT library accepts Float32Array.
                    */

                    const audioData =
                        audioBuffer
                            .getChannelData(0);


                    statusElement.textContent =
                        "Computing CQT...";


                    /*
                        Compute the entire CQT.
        
                        For now this is intentionally offline.
        
                        Later we can replace this with a
                        streaming / moving-window analysis.
                    */

                    cqtResult =
                        cqt.compute(
                            audioData
                        );


                    /*
                        Ask the CQT object for the actual
                        output dimensions.
                    */

                    const shape =
                        cqt.getOutputShape(
                            audioData.length
                        );

                    numFrames =
                        shape[0];

                    nBins =
                        shape[1];


                    console.log(
                        "CQT frames:",
                        numFrames
                    );

                    console.log(
                        "CQT bins:",
                        nBins
                    );

                    console.log(
                        "Frequencies:",
                        frequencies
                    );


                    /*
                        Build the octave UI.
                    */

                    buildOctaveViews();


                    /*
                        Show the first frame initially.
                    */

                    drawFrame(0);


                    playButton.disabled =
                        false;


                    statusElement.textContent =
                        file.name +
                        " — " +
                        audioBuffer.duration
                            .toFixed(1) +
                        "s";


                } catch (error) {

                    console.error(error);

                    statusElement.textContent =
                        "Error: " +
                        error.message;
                }
            }
        );


        /* ============================================================
           OCTAVE VIEWS
           ============================================================ */

        const octaveViews = [];


        function buildOctaveViews() {

            octaveContainer.innerHTML = "";

            octaveViews.length = 0;


            for (
                let octave = 0;
                octave < OCTAVES;
                octave++
            ) {

                /*
                    The CQT is ordered from low to high
                    frequency.
        
                    Each octave gets exactly
                    BINS_PER_OCTAVE bins.
                */

                const firstBin =
                    octave *
                    BINS_PER_OCTAVE;

                const lastBin =
                    firstBin +
                    BINS_PER_OCTAVE -
                    1;


                const lowFrequency =
                    frequencies[firstBin];

                const highFrequency =
                    frequencies[lastBin];


                /*
                    Container.
                */

                const octaveElement =
                    document.createElement(
                        "div"
                    );

                octaveElement.className =
                    "octave";


                /*
                    Header.
                */

                const header =
                    document.createElement(
                        "div"
                    );

                header.className =
                    "octave-header";


                const name =
                    document.createElement(
                        "span"
                    );

                name.className =
                    "octave-name";

                name.textContent =
                    `Octave ${octave + 1}`;


                const range =
                    document.createElement(
                        "span"
                    );

                range.textContent =
                    formatFrequency(
                        lowFrequency
                    ) +
                    " – " +
                    formatFrequency(
                        highFrequency
                    );


                header.appendChild(name);

                header.appendChild(range);


                /*
                    Canvas.
                */

                const rangeContainer =
                    document.createElement(
                        "div"
                    );

                rangeContainer.className =
                    "octave-range";


                const canvas =
                    document.createElement(
                        "canvas"
                    );

                rangeContainer.appendChild(
                    canvas
                );


                octaveElement.appendChild(
                    header
                );

                octaveElement.appendChild(
                    rangeContainer
                );

                octaveContainer.appendChild(
                    octaveElement
                );


                /*
                    Store everything required for drawing.
                */

                octaveViews.push({

                    octave,

                    firstBin,

                    lastBin,

                    canvas,

                    context:
                        canvas.getContext("2d")
                });
            }
        }


        /* ============================================================
           FREQUENCY FORMAT
           ============================================================ */

        function formatFrequency(frequency) {

            if (
                frequency >= 1000
            ) {

                return (
                    frequency / 1000
                ).toFixed(2) +
                    " kHz";
            }

            return (
                frequency
            ).toFixed(1) +
                " Hz";
        }


        /* ============================================================
           DRAW ONE CQT FRAME
           ============================================================ */

        function drawFrame(frame) {

            if (
                !cqtResult ||
                !octaveViews.length
            ) {
                return;
            }


            /*
                The CQT result is row-major:
        
                    frame * nBins + bin
            */

            const rowStart =
                frame *
                nBins;


            for (
                const view of octaveViews
            ) {

                const canvas =
                    view.canvas;

                const ctx =
                    view.context;


                /*
                    Make the canvas resolution match
                    its displayed size.
                */

                const rect =
                    canvas.getBoundingClientRect();

                const dpr =
                    window.devicePixelRatio ||
                    1;

                canvas.width =
                    Math.max(
                        1,
                        Math.floor(
                            rect.width *
                            dpr
                        )
                    );

                canvas.height =
                    Math.max(
                        1,
                        Math.floor(
                            rect.height *
                            dpr
                        )
                    );


                ctx.setTransform(
                    dpr,
                    0,
                    0,
                    dpr,
                    0,
                    0
                );


                const width =
                    rect.width;

                const height =
                    rect.height;


                ctx.clearRect(
                    0,
                    0,
                    width,
                    height
                );


                /*
                    Get the bins belonging to this octave.
                */

                const values = [];

                let maximum = 0;

                for (
                    let bin =
                        view.firstBin;

                    bin <=
                    view.lastBin;

                    bin++
                ) {

                    const value =
                        cqtResult[
                        rowStart +
                        bin
                        ];

                    values.push(
                        value
                    );

                    if (
                        value > maximum
                    ) {
                        maximum = value;
                    }
                }


                /*
                    Avoid division by zero.
                */

                if (
                    maximum <= 0
                ) {
                    maximum = 1;
                }


                /*
                    Draw a baseline.
                */

                ctx.beginPath();

                ctx.moveTo(
                    0,
                    height - 0.5
                );

                ctx.lineTo(
                    width,
                    height - 0.5
                );

                ctx.strokeStyle =
                    "rgba(255,255,255,0.08)";

                ctx.lineWidth = 1;

                ctx.stroke();


                /*
                    Draw the individual CQT bins.
        
                    Each vertical line represents one
                    logarithmically spaced frequency bin.
                */

                const binWidth =
                    width /
                    BINS_PER_OCTAVE;


                for (
                    let i = 0;
                    i < values.length;
                    i++
                ) {

                    let value =
                        values[i] /
                        maximum;


                    /*
                        Log/contrast adjustment.
        
                        This makes quieter spectral peaks
                        easier to see.
                    */

                    value =
                        Math.pow(
                            Math.max(
                                0,
                                Math.min(
                                    1,
                                    value
                                )
                            ),
                            0.55
                        );


                    const x =
                        (
                            i + 0.5
                        ) *
                        binWidth;


                    const barHeight =
                        value *
                        (height - 12);


                    ctx.fillStyle =
                        "rgba(255,255,255,0.75)";


                    ctx.fillRect(

                        x -
                        binWidth * 0.32,

                        height -
                        barHeight,

                        binWidth * 0.64,

                        barHeight
                    );
                }


                /*
                    Draw a thin curve connecting all
                    CQT bins in this octave.
        
                    This is intentionally NOT the final
                    periodic spline yet. It is simply a
                    representation of what the CQT gives us.
                */

                ctx.beginPath();

                for (
                    let i = 0;
                    i < values.length;
                    i++
                ) {

                    let value =
                        values[i] /
                        maximum;

                    value =
                        Math.pow(
                            Math.max(
                                0,
                                Math.min(
                                    1,
                                    value
                                )
                            ),
                            0.55
                        );


                    const x =
                        (
                            i + 0.5
                        ) *
                        binWidth;


                    const y =
                        height -
                        value *
                        (height - 12);


                    if (
                        i === 0
                    ) {

                        ctx.moveTo(
                            x,
                            y
                        );

                    } else {

                        ctx.lineTo(
                            x,
                            y
                        );
                    }
                }


                ctx.strokeStyle =
                    "#ffffff";

                ctx.lineWidth =
                    1.5;

                ctx.stroke();


                /*
                    Draw frequency labels at the
                    octave boundaries.
                */

                ctx.fillStyle =
                    "rgba(255,255,255,0.4)";

                ctx.font =
                    "10px system-ui";

                ctx.textAlign =
                    "left";

                ctx.fillText(

                    formatFrequency(
                        frequencies[
                        view.firstBin
                        ]
                    ),

                    4,
                    12
                );


                ctx.textAlign =
                    "right";

                ctx.fillText(

                    formatFrequency(
                        frequencies[
                        view.lastBin
                        ]
                    ),

                    width - 4,
                    12
                );
            }
        }


        /* ============================================================
           PLAYBACK
           ============================================================ */

        playButton.addEventListener(
            "click",
            async () => {

                if (!audioBuffer)
                    return;


                if (
                    !audioContext
                ) {

                    audioContext =
                        new AudioContext();
                }


                if (
                    audioContext.state ===
                    "suspended"
                ) {

                    await audioContext.resume();
                }


                /*
                    Stop / pause.
                */

                if (
                    playing
                ) {

                    playbackOffset =
                        (
                            performance.now() /
                            1000 -
                            playbackStartTime +
                            playbackOffset
                        ) %
                        audioBuffer.duration;


                    if (
                        sourceNode
                    ) {

                        try {
                            sourceNode.stop();
                        } catch (_) { }
                    }


                    sourceNode =
                        null;

                    playing =
                        false;


                    playButton.textContent =
                        "Play";


                    return;
                }


                /*
                    Start playback.
                */

                sourceNode =
                    audioContext
                        .createBufferSource();


                sourceNode.buffer =
                    audioBuffer;


                sourceNode.connect(
                    audioContext.destination
                );


                playbackStartTime =
                    performance.now() /
                    1000;


                sourceNode.start(
                    0,
                    playbackOffset
                );


                sourceNode.onended =
                    () => {

                        if (!playing)
                            return;

                        playing =
                            false;

                        playbackOffset =
                            0;

                        playButton.textContent =
                            "Play";
                    };


                playing =
                    true;


                playButton.textContent =
                    "Pause";
            }
        );


        /* ============================================================
           ANIMATION
           ============================================================ */

        function animate() {

            if (
                playing &&
                audioBuffer &&
                numFrames > 0
            ) {

                const elapsed =
                    performance.now() /
                    1000 -
                    playbackStartTime +
                    playbackOffset;


                /*
                    Convert playback time to CQT frame.
                */

                const frame =
                    Math.floor(
                        elapsed *
                        audioBuffer.sampleRate /
                        HOP_LENGTH
                    );


                /*
                    Loop around if necessary.
                */

                const wrappedFrame =
                    (
                        frame %
                        numFrames +
                        numFrames
                    ) %
                    numFrames;


                drawFrame(
                    wrappedFrame
                );
            }


            requestAnimationFrame(
                animate
            );
        }


        /* ============================================================
           RESIZE
           ============================================================ */

        window.addEventListener(
            "resize",
            () => {

                if (
                    numFrames > 0
                ) {

                    drawFrame(
                        0
                    );
                }
            }
        );


        /* ============================================================
           STARTUP
           ============================================================ */

        await initializeCQT();

        requestAnimationFrame(
            animate
        );

    </script>

</body>

</html>
